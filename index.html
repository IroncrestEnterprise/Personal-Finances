                    <span className="text-sm font-medium truncate">{a.name}</span>
                    <span className="text-xs text-slate-500 shrink-0">
                      {(a.files || []).length} {(a.files || []).length === 1 ? "statement" : "statements"}
                    </span>
                  </button>
                </li>
              ))}
            </ul>
            <div className="px-4 py-3 border-t border-slate-200 flex justify-between items-center gap-2">
              <button
                onClick={() => {
                  const id = createAccount(pendingFiles[0].fileName.replace(/\.[^.]+$/, ""));
                  attachStatements(id, pendingFiles);
                  setPendingFiles(null);
                  setExpanded(id);
                }}
                className="text-sm text-indigo-700 hover:text-indigo-900 inline-flex items-center gap-1.5"
              >
                <Plus size={14} /> New account instead
              </button>
              <button onClick={() => setPendingFiles(null)} className="px-3 py-1.5 text-sm text-slate-600 hover:text-slate-900">Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* ---- rule editor ---- */}
      {draftRule && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50" onClick={() => setDraftRule(null)}>
          <div className="bg-white rounded shadow-xl w-full max-w-md" onClick={(e) => e.stopPropagation()}>
            <div className="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
              <h3 className="font-semibold text-sm">New rule</h3>
              <button onClick={() => setDraftRule(null)} className="text-slate-400 hover:text-slate-700"><X size={16} /></button>
            </div>
            <div className="p-4 space-y-3 text-sm">
              <label className="block">
                <span className="text-xs text-slate-600">When the description</span>
                <div className="flex gap-2 mt-1">
                  <select
                    value={draftRule.type}
                    onChange={(e) => setDraftRule({ ...draftRule, type: e.target.value })}
                    className="border border-slate-300 rounded px-2 py-1.5 bg-white"
                  >
                    <option value="contains">contains</option>
                    <option value="starts">starts with</option>
                    <option value="exact">is exactly</option>
                    <option value="regex">matches regex</option>
                  </select>
                  <input
                    value={draftRule.match}
                    onChange={(e) => setDraftRule({ ...draftRule, match: e.target.value })}
                    className="flex-1 border border-slate-300 rounded px-2 py-1.5 font-mono text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    placeholder="TRADER JOE"
                  />
                </div>
              </label>

              <label className="block">
                <span className="text-xs text-slate-600">Show it as</span>
                <input
                  value={draftRule.rename}
                  onChange={(e) => setDraftRule({ ...draftRule, rename: e.target.value })}
                  className="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  placeholder="Leave blank to keep the automatic name"
                />
              </label>

              <label className="block">
                <span className="text-xs text-slate-600">Category</span>
                <select
                  value={draftRule.category}
                  onChange={(e) => setDraftRule({ ...draftRule, category: e.target.value })}
                  className="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 bg-white"
                >
                  <option value="">Leave to the automatic guess</option>
                  {categories.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </label>

              <p className="text-xs text-slate-500">
                Matching is case-insensitive and checks both the original and cleaned text.
                Rules apply to every account at once.
              </p>
            </div>
            <div className="px-4 py-3 border-t border-slate-200 flex justify-end gap-2">
              <button onClick={() => setDraftRule(null)} className="px-3 py-1.5 text-sm text-slate-600 hover:text-slate-900">Cancel</button>
              <button
                onClick={() => { if (draftRule.match.trim()) { addRule(draftRule); setDraftRule(null); setView("rules"); } }}
                className="px-3 py-1.5 text-sm rounded bg-indigo-600 text-white hover:bg-indigo-500 inline-flex items-center gap-1.5"
              >
                <Check size={14} /> Save rule
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

</script>

<script>
(function () {
  var msg = document.getElementById("boot-msg");
  function say(t) { if (msg) msg.textContent = t; }

  /* ---- storage ----
     Three modes, decided at boot:
       server : a backend is answering, so settings sync between computers
       local  : localStorage only (opened as a plain file, or no backend)
       memory : the browser blocked storage; lasts until the tab closes
  ---------------------------------------------------------------------- */
  var mem = {}, persistent = true, serverMode = false, serverCache = {};
  try {
    localStorage.setItem("__probe", "1");
    localStorage.removeItem("__probe");
  } catch (e) { persistent = false; }

  function readLocal(k)     { return persistent ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }
  function writeLocal(k, v) { try { persistent ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } }
  function dropLocal(k)     { try { persistent ? localStorage.removeItem(k) : delete mem[k]; } catch (e) {} }
  function localKeys()      { try { return persistent ? Object.keys(localStorage) : Object.keys(mem); } catch (e) { return []; } }

  /* Ask the backend for everything once. If nothing answers, we're standalone. */
  window.__ledgerProbe = function () {
    if (typeof fetch !== "function" || location.protocol === "file:") return Promise.resolve();
    return fetch("api/kv", { headers: { Accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("no backend"); return r.json(); })
      .then(function (obj) { serverMode = true; serverCache = obj || {}; })
      .catch(function () { serverMode = false; });
  };

  window.storage = {
    get: function (k) {
      var v = serverMode ? (k in serverCache ? serverCache[k] : null) : readLocal(k);
      /* Fall back to whatever this machine had cached if the server is empty. */
      if (v === null && serverMode) v = readLocal(k);
      if (v === null) return Promise.reject(new Error("not found"));
      return Promise.resolve({ key: k, value: v });
    },
    set: function (k, v) {
      writeLocal(k, v); // always keep a local copy, so a dropped connection costs nothing
      if (!serverMode) return Promise.resolve({ key: k, value: v });
      serverCache[k] = v;
      return fetch("api/kv/" + encodeURIComponent(k), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: v })
      }).then(function (r) {
        if (!r.ok) throw new Error("save failed");
        return { key: k, value: v };
      });
    },
    delete: function (k) {
      dropLocal(k);
      if (serverMode) {
        delete serverCache[k];
        fetch("api/kv/" + encodeURIComponent(k), { method: "DELETE" }).catch(function () {});
      }
      return Promise.resolve({ key: k, deleted: true });
    },
    list: function (p) {
      var keys = serverMode ? Object.keys(serverCache) : localKeys();
      return Promise.resolve({ keys: keys.filter(function (k) { return !p || k.indexOf(p) === 0; }) });
    }
  };

  /* Statement data lives here. Deliberately NOT part of window.storage, so it
     never reaches a backend and never lands in the settings file. set() is
     allowed to throw on quota so the app knows to trim. */
  var CACHE_PREFIX = "ledger-cache:";
  window.localCache = {
    get: function (k) {
      try { return persistent ? localStorage.getItem(CACHE_PREFIX + k) : (mem[CACHE_PREFIX + k] || null); }
      catch (e) { return null; }
    },
    set: function (k, v) {
      if (!persistent) { mem[CACHE_PREFIX + k] = v; return; }
      localStorage.setItem(CACHE_PREFIX + k, v); // throws when full, on purpose
    },
    remove: function (k) {
      try { persistent ? localStorage.removeItem(CACHE_PREFIX + k) : delete mem[CACHE_PREFIX + k]; }
      catch (e) {}
    }
  };

  Object.defineProperty(window, "__ledgerMode", {
    get: function () { return serverMode ? "server" : persistent ? "local" : "memory"; }
  });

  /* ---- load a script, trying each mirror in turn ---- */
  function loadOne(urls, done) {
    var i = 0;
    (function attempt() {
      if (i >= urls.length) return done(new Error(urls[0]));
      var s = document.createElement("script");
      s.src = urls[i++];
      s.onload = function () { done(null); };
      s.onerror = attempt;
      document.head.appendChild(s);
    })();
  }

  var LIBS = [
    { name: "React", urls: ["https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
                            "https://unpkg.com/react@18.3.1/umd/react.production.min.js"] },
    { name: "ReactDOM", urls: ["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
                               "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"] },
    /* recharts' UMD build reads ReactIs and PropTypes off window; without them
       the file loads but throws while executing and never sets window.Recharts. */
    { name: "react-is", urls: ["https://unpkg.com/react-is@18.3.1/umd/react-is.production.min.js",
                               "https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js"] },
    { name: "prop-types", urls: ["https://unpkg.com/prop-types@15.8.1/prop-types.min.js",
                                 "https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"] },
    { name: "spreadsheet reader", urls: ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
                                         "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"] },
    { name: "charts", urls: ["https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js",
                             "https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js",
                             "https://unpkg.com/recharts/umd/Recharts.min.js"] },
    { name: "compiler", urls: ["https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js",
                               "https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"] }
  ];

  var step = 0;
  (function next(err) {
    if (err) return say("Couldn't load a required library. Check your internet connection and reload.");
    if (step > 0) say("Loaded " + LIBS[step - 1].name + "\u2026");
    if (step === LIBS.length) {
      say("Checking for saved settings\u2026");
      return window.__ledgerProbe().then(start);
    }
    var lib = LIBS[step++];
    loadOne(lib.urls, next);
  })();

  function start() {
    try {
      say("Starting\u2026");
      const ICON_PATHS = {"Upload": ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4", "M17 8l-5-5-5 5", "M12 3v12"], "Download": ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4", "M7 10l5 5 5-5", "M12 15V3"], "Trash2": ["M3 6h18", "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6", "M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2", "M10 11v6", "M14 11v6"], "Plus": ["M5 12h14", "M12 5v14"], "Search": [{"c": [11, 11, 8]}, "m21 21-4.3-4.3"], "Wand2": ["M15 4V2", "M15 16v-2", "M8 9h2", "M20 9h2", "M17.8 11.8 19 13", "M15 9h.01", "M17.8 6.2 19 5", "m3 21 9-9", "M12.2 6.2 11 5"], "X": ["M18 6 6 18", "m6 6 12 12"], "Check": ["M20 6 9 17l-5-5"], "ChevronDown": ["m6 9 6 6 6-6"], "ChevronUp": ["m18 15-6-6-6 6"], "AlertCircle": [{"c": [12, 12, 10]}, "M12 8v4", "M12 16h.01"], "AlertTriangle": ["m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z", "M12 9v4", "M12 17h.01"], "FileSpreadsheet": ["M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z", "M14 2v5h5", "M8 13h2", "M14 13h2", "M8 17h2", "M14 17h2"], "RotateCcw": ["M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8", "M3 3v5h5"], "ArrowUpRight": ["M7 7h10v10", "M7 17 17 7"], "ArrowDownRight": ["m7 7 10 10", "M17 7v10H7"], "Calendar": [{"r": [3, 4, 18, 18, 2]}, "M16 2v4", "M8 2v4", "M3 10h18"], "Wallet": ["M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1", "M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"]};

      /* Icons as plain SVG, so there's no icon library to fetch. */
      function makeIcon(spec) {
        return function (props) {
          props = props || {};
          var size = props.size || 16;
          var kids = spec.map(function (d, i) {
            if (typeof d === "string") return React.createElement("path", { key: i, d: d });
            if (d.c) return React.createElement("circle", { key: i, cx: d.c[0], cy: d.c[1], r: d.c[2] });
            return React.createElement("rect", { key: i, x: d.r[0], y: d.r[1], width: d.r[2], height: d.r[3], rx: d.r[4] });
          });
          return React.createElement("svg", {
            xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24",
            fill: "none", stroke: "currentColor", strokeWidth: 2,
            strokeLinecap: "round", strokeLinejoin: "round",
            className: props.className || "", style: { display: "inline-block", flexShrink: 0 }
          }, kids);
        };
      }
      var Icons = {};
      Object.keys(ICON_PATHS).forEach(function (n) { Icons[n] = makeIcon(ICON_PATHS[n]); });

      var preamble =
        "const {useState,useEffect,useMemo,useRef,useCallback} = React;\n" +
        "const {BarChart,Bar,AreaChart,Area,ComposedChart,Line,Cell,LabelList,XAxis,YAxis," +
        "CartesianGrid,Tooltip,ReferenceLine,ResponsiveContainer,RadialBarChart,RadialBar,PolarAngleAxis} = Recharts;\n" +
        Object.keys(ICON_PATHS).map(function (n) { return "const " + n + " = __ICONS." + n + ";"; }).join("\n") + "\n";

      var source = document.getElementById("app-source").textContent;
      ["React", "ReactDOM", "XLSX", "Babel"].forEach(function (g) {
        if (!window[g]) throw new Error(g + " did not load");
      });

      /* If the chart library is missing, stub it out rather than refusing to
         start. Every other part of the app works fine without charts. */
      var RECHARTS_NAMES = ["BarChart","Bar","AreaChart","Area","ComposedChart","Line","Cell","LabelList",
        "XAxis","YAxis","CartesianGrid","Tooltip","ReferenceLine","ResponsiveContainer",
        "RadialBarChart","RadialBar","PolarAngleAxis"];
      var charts = window.Recharts;
      if (!charts) {
        console.warn("Chart library unavailable; the rest of the app still works.");
        var Absent = function () {
          return React.createElement("div",
            { className: "text-xs text-slate-400 py-10 text-center" },
            "Chart unavailable \u2014 reload when you're back online");
        };
        charts = {};
        RECHARTS_NAMES.forEach(function (n) { charts[n] = Absent; });
      }

      var code = Babel.transform(preamble + source + "\nwindow.__LedgerApp = App;", {
        presets: [["react", { runtime: "classic" }]]
      }).code;

      new Function("React", "Recharts", "XLSX", "__ICONS", code)(React, charts, XLSX, Icons);
      var App = window.__LedgerApp;
      if (!App) throw new Error("the app did not compile");

      /* Only a class component can catch an error thrown during render.
         The function version I tried first never sees them, which is how a
         crash turned into a blank page. */
      var NL = String.fromCharCode(10);

      function crashMarkup(err) {
        var e = err || {};
        return React.createElement("div", { style: {
          minHeight: "100vh", background: "#f1f5f9", padding: "32px",
          fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", color: "#334155"
        } },
          React.createElement("h1", { style: { fontSize: "16px", marginBottom: "8px", color: "#0f172a" } },
            "The app hit an error"),
          React.createElement("p", { style: { fontSize: "13px", marginBottom: "16px" } },
            "Your saved settings and statements are untouched. Send this message along and it can be fixed."),
          React.createElement("pre", { style: {
            whiteSpace: "pre-wrap", wordBreak: "break-word", fontSize: "12px",
            background: "#fff", border: "1px solid #e2e8f0", borderRadius: "8px", padding: "12px"
          } }, String(e.message || e) + NL + NL + String(e.stack || "").split(NL).slice(0, 8).join(NL))
        );
      }


      function ErrorBoundary(props) { this.props = props; this.state = { err: null }; }
      ErrorBoundary.prototype = Object.create(React.Component.prototype);
      ErrorBoundary.prototype.constructor = ErrorBoundary;
      ErrorBoundary.getDerivedStateFromError = function (err) { return { err: err }; };
      ErrorBoundary.prototype.componentDidCatch = function (err) { console.error(err); };
      ErrorBoundary.prototype.render = function () {
        return this.state.err ? crashMarkup(this.state.err) : this.props.children;
      };

      /* Installed before render, so an error on the very first paint is caught. */
      window.addEventListener("error", function (e) {
        var el = document.getElementById("root");
        if (el && el.childElementCount === 0) {
          try { ReactDOM.createRoot(el).render(crashMarkup(e.error || e)); } catch (x) {}
        }
      });

      var root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(ErrorBoundary, null, React.createElement(App)));

      /* Last resort: if React bailed out and left the page empty, say so. */
      setTimeout(function () {
        var el = document.getElementById("root");
        if (el && el.childElementCount === 0) {
          el.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;'
            + 'font-family:system-ui;color:#334155;background:#f1f5f9;padding:24px;text-align:center">'
            + '<div><p>The app failed to render.</p>'
            + '<p style="font-size:12px;color:#94a3b8;margin-top:8px">'
            + 'Open the browser console (F12) and send the first red error.</p></div></div>';
        }
      }, 1200);

      console.log("Ledger Cleaner storage mode:", window.__ledgerMode);
      if (window.__ledgerMode === "memory") {
        console.warn("This browser blocked storage for this page. Your setup will not survive a reload \u2014 use Settings \u2192 Download settings to keep it.");
      }
    } catch (e) {
      console.error(e);
      say("Something went wrong starting the app: " + e.message);
    }
  }
})();
</script>
