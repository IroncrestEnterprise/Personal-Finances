/* ============================================================================
 * 4. NAME CLEANUP — only runs when no alias matched.
 * ==========================================================================*/
const STATES = "AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC";
const STATE_SET = new Set(STATES.split("|"));

const PREFIX_SCRUB = [
  /^(purchase|recurring payment|payment)\s+authorized\s+on\s+\d{1,2}\/\d{1,2}\s*/i,
  /^(pos|pin)\s+(purchase|debit|credit)?\s*/i,

  /^(external|internal|online|mobile|internet|electronic|preauthorized|recurring|automatic)\s+/i,

  /^(withdrawal|deposit|purchase|payment|transfer)\s+(at|to|from|-)\s*/i,
  /^(sq|tst|py|in|sp|dd|eb|wpy|pp|paypal|clover|toast|levelup|ip|gp|msft|apl)\s*\*+\s*/i,
  /^\d{1,2}\/\d{1,2}(\/\d{2,4})?\s+/,
];

const INLINE_SCRUB = [
  /\b(web|ppd|ccd|tel|arc|ctx)\s*id:?\s*\S+/gi,
  /\bdes:\s*\S+/gi,
  /\bindn:\s*/gi,
  /\bref\s*#?\s*\w{5,}/gi,
  /\btrace\s*#?\s*\w+/gi,
  /\bconf(irmation)?\s*#?\s*\w{5,}/gi,
  /\bx{2,}\d{2,}\b/gi,
  /\*{2,}\d{2,}\b/g,
  /\bcard\s?\d{4}\b/gi,
  /\b\d{3}[-.]\d{3}[-.]\d{4}\b/g,
  /\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,
  /\b[a-z0-9-]+\.(com|net|org|co|io|us)\b/gi,
  /\bstore\s+#?\d+\b/gi,
  /\s#\s?\d+\b/g,
  /\b\d{7,}\b/g,
];

const KEEP_UPPER = new Set(["ATM","USPS","UPS","DMV","IRS","CVS","IKEA","BP","KFC","LLC","INC","LLP","US","USA","AMC","REI","GNC","ULTA","TSA","DSW","HOA","AAA","CO","IHOP","BJS","QT","MTA","EDD","SCE","HEB"]);
const SMALL_WORDS = new Set(["of","and","the","a","an","in","on","at","to","for","de","la","el","by"]);

function titleCase(s) {
  return s
    .split(/\s+/)
    .filter(Boolean)
    .map((w, i) => {
      const bare = w.replace(/[^A-Za-z&']/g, "");
      if (KEEP_UPPER.has(bare.toUpperCase())) return w.toUpperCase();
      const lower = w.toLowerCase();
      if (i > 0 && SMALL_WORDS.has(lower)) return lower;
      return lower.replace(/^[a-z]/, (c) => c.toUpperCase()).replace(/([-'])([a-z])/g, (m, p, c) => p + c.toUpperCase());
    })
    .join(" ");
}

function trimLocationTokens(s) {
  let tokens = s.split(/\s+/).filter(Boolean);
  if (tokens.length < 2) return tokens.join(" ");
  const last = tokens[tokens.length - 1].toUpperCase().replace(/[^A-Z]/g, "");
  if (!STATE_SET.has(last)) return tokens.join(" ");
  tokens = tokens.slice(0, -1); // drop the state code
  let drops = 0;
  while (drops < 2 && tokens.length > 1) { tokens.pop(); drops++; }
  return tokens.join(" ");
}

function scrubName(raw, opts) {
  let s = " " + raw.replace(/\s+/g, " ").trim() + " ";
  let changed = true, guard = 0;
  while (changed && guard++ < 8) {
    changed = false;
    for (const re of PREFIX_SCRUB) {
      const next = s.trimStart().replace(re, "");
      if (next !== s.trimStart()) { s = " " + next; changed = true; }
    }
  }
  for (const re of INLINE_SCRUB) s = s.replace(re, " ");
  s = s.replace(/[|;]+/g, " ").replace(/\s+/g, " ").trim();
  s = s.replace(/^[-*#.,\s]+|[-*#.,\s]+$/g, "");
  if (opts.trimLocation) s = trimLocationTokens(s);
  s = s.replace(/\s+/g, " ").trim();
  if (!s) return raw.trim();
  return opts.titleCase ? titleCase(s) : s.toUpperCase();
}

/* ============================================================================
 * 5. RULE ENGINE
 * ==========================================================================*/
function ruleMatches(rule, raw, clean) {
  if (!rule.match) return false;
  const hay = [raw, clean];
  try {
    if (rule.type === "regex") {
      const re = new RegExp(rule.match, "i");
      return hay.some((h) => re.test(h));
    }
    const m = rule.match.toLowerCase();
    return hay.some((h) => {
      const t = h.toLowerCase();
      if (rule.type === "exact") return t === m;
      if (rule.type === "starts") return t.startsWith(m);
      return t.includes(m);
    });
  } catch {
    return false;
  }
}

function enrich(txn, rules, opts, overrides, catMap) {
  const raw = txn.rawDesc || "";
  let name = null;
  let category = null;
  let source = "auto";
  let ruleId = null;

  // Your rules run first.
  for (const r of rules) {
    if (r.enabled === false) continue;
    if (ruleMatches(r, raw, raw)) {
      ruleId = r.id;
      if (r.rename) name = r.rename;
      if (r.category) { category = r.category; source = "rule"; }
      break;
    }
  }

  // Built-in aliases, then scrubbing.
  if (!name) {
    for (const [re, canonical] of ALIASES) {
      if (re.test(raw)) { name = canonical; break; }
    }
  }
  if (!name) name = scrubName(raw, opts);

  if (!category) {
    for (const [re, cat] of CATEGORY_RULES) {
      if (re.test(raw) || re.test(name)) { category = cat; break; }
    }
  }
  if (!category) {
    category = txn.amount > 0 ? "Income" : "Uncategorized";
    source = txn.amount > 0 ? "auto" : "none";
  }

  const key = overrideKey(txn);
  if (overrides[key]) { category = overrides[key]; source = "manual"; }

  /* A category the user renamed or deleted still comes out of the built-in
     rules under its old name, so translate it on the way out. */
  if (catMap && catMap[category]) category = catMap[category];

  return { ...txn, cleanDesc: name, category, source, ruleId };
}

const overrideKey = (t) => `${t.date}|${t.rawAmount ?? t.amount}|${(t.rawDesc || "").slice(0, 60)}`;

/* Per-entry edits (deleting, flipping direction) are scoped to the account, so
   touching a charge in one account leaves an identical one elsewhere alone. */
const entryKey = (t) => `${t.sourceId}|${t.date}|${t.rawAmount ?? t.amount}|${(t.rawDesc || "").slice(0, 60)}`;

/* ============================================================================
 * 6. SPREADSHEET PARSING
 * ==========================================================================*/
const HEADER_HINT = /date|desc|amount|debit|credit|payee|memo|balance|transaction|withdraw|deposit|type|reference/i;

function detectHeaderRow(rows) {
  let best = 0, bestScore = -1;
  for (let i = 0; i < Math.min(rows.length, 25); i++) {
    const r = rows[i] || [];
    const score = r.filter((c) => typeof c === "string" && HEADER_HINT.test(c)).length;
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return bestScore >= 2 ? best : 0;
}

function pickColumn(headers, patterns) {
  for (const p of patterns) {
    const i = headers.findIndex((h) => p.test(String(h || "")));
    if (i !== -1) return i;
  }
  return -1;
}

function autoMap(headers) {
  return {
    date: pickColumn(headers, [/transaction date/i, /post(ed|ing)? date/i, /^date$/i, /date/i]),
    desc: pickColumn(headers, [/descript/i, /payee/i, /merchant/i, /^name$/i, /details?/i, /memo/i, /transaction/i]),
    amount: pickColumn(headers, [/^amount$/i, /amount/i, /^amt$/i]),
    debit: pickColumn(headers, [/debit/i, /withdrawal/i]),
    credit: pickColumn(headers, [/credit/i, /deposit/i]),
  };
}

function parseAmount(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return v;
  let s = String(v).trim().replace(/[$\s,]/g, "");
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  if (s.endsWith("-")) { neg = true; s = s.slice(0, -1); }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}

function parseDate(v) {
  if (!v && v !== 0) return "";
  if (v instanceof Date && !isNaN(v)) return toISO(v);
  if (typeof v === "number" && v > 20000 && v < 60000) {
    return toISO(new Date(Math.round((v - 25569) * 86400000)));
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let [, a, b, y] = m;
    if (y.length === 2) y = String(2000 + parseInt(y, 10));
    return `${y}-${String(a).padStart(2, "0")}-${String(b).padStart(2, "0")}`;
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  const d = new Date(s);
  return isNaN(d) ? "" : toISO(d);
}

function toISO(d) {
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}

/* One statement file, read through its own column mapping.
   Sign flipping is an account-level setting so every statement agrees. */
function fileTransactions(file, account) {
  const { rows, headerRow, mapping } = file;
  const out = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    if (!r.length) continue;
    const rawDesc = mapping.desc >= 0 ? String(r[mapping.desc] ?? "").trim() : "";
    if (!rawDesc) continue;

    let amount = null;
    if (mapping.amount >= 0) amount = parseAmount(r[mapping.amount]);
    if (amount === null && (mapping.debit >= 0 || mapping.credit >= 0)) {
      const d = mapping.debit >= 0 ? parseAmount(r[mapping.debit]) : null;
      const c = mapping.credit >= 0 ? parseAmount(r[mapping.credit]) : null;
      if (d !== null || c !== null) amount = (c || 0) - Math.abs(d || 0);
    }
    if (amount === null) continue;
    if (account.flip) amount = -amount;

    const date = mapping.date >= 0 ? parseDate(r[mapping.date]) : "";
    out.push({ id: `${account.id}:${file.fid}:${i}`, sourceId: account.id, fileId: file.fid, date, rawDesc, amount, rawAmount: amount });
  }
  return out;
}

/* Every statement filed under one account, combined. */
function accountTransactions(account) {
  return (account.files || []).flatMap((f) => fileTransactions(f, account));
}

const sameHeaders = (a, b) =>
  !!a && !!b && a.length === b.length && a.every((h, i) => h === b[i]);

/* ============================================================================
 * 6b. PDF STATEMENTS
 *   PDFs carry no table structure, only positioned text. We rebuild lines by
 *   y-position, then read each line as: date, description, and whatever
 *   numbers trail it. Those numbers become separate columns so the existing
 *   column mapping can sort out which is the amount and which is a balance.
 * ==========================================================================*/
const PDFJS_VERSION = "3.11.174";
let pdfLibPromise = null;

function loadPdfJs() {
  if (typeof window === "undefined") return Promise.reject(new Error("no window"));
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfLibPromise) return pdfLibPromise;
  pdfLibPromise = new Promise((resolve, reject) => {
    const base = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}`;
    const tag = document.createElement("script");
    tag.src = `${base}/pdf.min.js`;
    tag.onload = () => {
      if (!window.pdfjsLib) return reject(new Error("pdf.js unavailable"));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${base}/pdf.worker.min.js`;
      resolve(window.pdfjsLib);
    };
    tag.onerror = () => reject(new Error("pdf.js unavailable"));
    document.head.appendChild(tag);
  });
  return pdfLibPromise;
}

/* Text items sharing a y-coordinate are one visual line. */
async function pdfToLines(buffer) {
  const pdfjsLib = await loadPdfJs();
  const doc = await pdfjsLib.getDocument({ data: buffer }).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const rows = new Map();
    for (const item of content.items) {
      if (!item.str || !item.str.trim()) continue;
      const y = Math.round(item.transform[5] / 2.5) * 2.5;
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push({ x: item.transform[4], str: item.str });
    }
    for (const y of [...rows.keys()].sort((a, b) => b - a)) {
      const text = rows.get(y).sort((a, b) => a.x - b.x).map((i) => i.str).join(" ").replace(/\s+/g, " ").trim();
      if (text) lines.push(text);
    }
  }
  return lines;
}

const AMOUNT_TOKEN = /\(?-?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?-?/g;
const DATE_SLASH = /^(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)\s+/;
const DATE_MONTH = /^((?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:,?\s+\d{4})?)\s+/i;

/* Statements often print MM/DD with the year only in the header. */
function dominantYear(lines) {
  const tally = {};
  for (const l of lines) {
    for (const y of l.match(/\b(19|20)\d{2}\b/g) || []) tally[y] = (tally[y] || 0) + 1;
  }
  const best = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : "";
}

function linesToRows(lines) {
  const year = dominantYear(lines);
  const rows = [];
  let widest = 0;
  for (const line of lines) {
    const m = line.match(DATE_SLASH) || line.match(DATE_MONTH);
    if (!m) continue;
    let date = m[1].trim();
    if (year && /^\d{1,2}\/\d{1,2}$/.test(date)) date = `${date}/${year}`;

    const rest = line.slice(m[0].length);
    const amounts = rest.match(AMOUNT_TOKEN);
    if (!amounts || !amounts.length) continue;

    const desc = rest.slice(0, rest.indexOf(amounts[0])).trim().replace(/[\s.]+$/, "");
    if (!desc) continue;

    const nums = amounts.slice(0, 3);
    widest = Math.max(widest, nums.length);
    rows.push([date, desc, ...nums]);
  }
  if (!rows.length) return [];
  const header = ["Date", "Description"];
  for (let i = 0; i < widest; i++) header.push(i === 0 ? "Amount" : `Number ${i + 1}`);
  return [header, ...rows.map((r) => { const c = [...r]; while (c.length < header.length) c.push(""); return c; })];
}

/* ============================================================================
 * 7. SMALL PRESENTATION HELPERS
 * ==========================================================================*/
const money = (n) =>
  new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);

const shortDate = (iso) => (iso ? `${iso.slice(5, 7)}/${iso.slice(8, 10)}/${iso.slice(2, 4)}` : "—");

const CHIPS = [
  "bg-rose-100 text-rose-900", "bg-amber-100 text-amber-900", "bg-lime-100 text-lime-900",
  "bg-emerald-100 text-emerald-900", "bg-indigo-100 text-indigo-900", "bg-sky-100 text-sky-900",
  "bg-indigo-100 text-indigo-900", "bg-violet-100 text-violet-900",
  "bg-fuchsia-100 text-fuchsia-900", "bg-orange-100 text-orange-900",
];
function chipFor(cat) {
  if (cat === "Uncategorized") return "bg-amber-200 text-amber-900";
  if (cat === "Income") return "bg-emerald-100 text-emerald-900";
  if (cat === "Transfers") return "bg-slate-200 text-slate-700";
  let h = 0;
  for (let i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) >>> 0;
  return CHIPS[h % CHIPS.length];
}

const MENU = "absolute left-0 top-full mt-1 z-30 w-52 bg-white border border-slate-200 rounded-lg shadow-lg py-1 normal-case tracking-normal font-normal text-slate-700";
const ITEM = "w-full text-left px-3 py-1.5 text-xs hover:bg-indigo-50 hover:text-indigo-800";

/* Loaded statements are cached on this computer only. They are deliberately
   kept out of STORE_KEY so they never travel to a server or a settings file. */
const STATEMENT_KEY = "statements-v1";

const monthKey = (iso) => (iso ? iso.slice(0, 7) : "");
const monthLabel = (k) => {
  const [y, m] = k.split("-");
  return new Date(Date.UTC(+y, +m - 1, 1)).toLocaleDateString("en-US", {
    month: "short", year: "2-digit", timeZone: "UTC",
  });
};
const longDate = (iso) =>
  iso
    ? new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", {

/* ============================================================================
 * 8. ANALYTICS — one pass over a set of transactions.
 *    Transfers are excluded from spending figures so paying off a card
 *    doesn't get counted as spending twice.
 * ==========================================================================*/
/* isTransfer decides what doesn't count as real income or spending:
   always the Transfers category, plus any the user has excluded. */
function summarize(txns, isTransfer = (c) => c === "Transfers") {
  let inflow = 0, outflow = 0, review = 0, dated = 0;
  let first = "", last = "", largest = null;
  const cats = {}, merch = {}, months = {};

  for (const t of txns) {
    if (t.date) {
      dated++;
      if (!first || t.date < first) first = t.date;
      if (!last || t.date > last) last = t.date;
    }
    if (t.category === "Uncategorized") review++;
    if (isTransfer(t.category)) continue;

    const mk = monthKey(t.date);
    if (mk && !months[mk]) months[mk] = { in: 0, out: 0 };

    if (t.amount > 0) {
      inflow += t.amount;
      if (mk) months[mk].in += t.amount;
    } else {
      const a = Math.abs(t.amount);
      outflow += a;
      if (mk) months[mk].out += a;
      cats[t.category] = (cats[t.category] || 0) + a;
      const m = merch[t.cleanDesc] || (merch[t.cleanDesc] = { total: 0, count: 0, last: "", months: new Set() });
      m.total += a;
      m.count += 1;
      if (t.date > m.last) m.last = t.date;
      if (mk) m.months.add(mk);
      if (!largest || a > Math.abs(largest.amount)) largest = t;
    }
  }

  const merchants = Object.entries(merch).sort((a, b) => b[1].total - a[1].total);
  const recurring = merchants
    .filter(([, m]) => m.months.size >= 3 && m.count >= 3)
    .map(([name, m]) => ({ name, ...m, monthly: m.total / m.months.size }))
    .sort((a, b) => b.monthly - a.monthly);

  return {
    count: txns.length,
    dated,
    inflow,
    outflow,
    net: inflow - outflow,
    first,
    last,
    review,
    largest,
    months,
    monthList: Object.keys(months).sort(),
    cats: Object.entries(cats).sort((a, b) => b[1] - a[1]),
    merchants,
    recurring,
  };
}

/* ============================================================================
 * 8b. SPENDING BY CATEGORY, MONTH BY MONTH
 *   Every category, not just the top few. Transfers are excluded and deposits
 *   ignored, so this is money out only.
 * ==========================================================================*/
function monthRange(key) {
  const [y, m] = key.split("-").map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return [`${key}-01`, `${key}-${String(last).padStart(2, "0")}`];
}

function fullMonthName(key) {
  const [y, m] = key.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString("en-US", {
    month: "long", year: "numeric", timeZone: "UTC",
  });
}

function SpendByCategory({ transactions, categories, isTransfer, onJump }) {
  const [month, setMonth] = useState("");
  const [showEmpty, setShowEmpty] = useState(false);

  /* One pass: spend per category per month. */
  const byMonth = useMemo(() => {
    const acc = {};
    for (const t of transactions) {
      if (isTransfer(t.category) || t.amount >= 0) continue;
      const k = monthKey(t.date);
      if (!k) continue;
      const bucket = acc[k] || (acc[k] = { total: 0, cats: {} });
      const amt = Math.abs(t.amount);
      bucket.total += amt;
      bucket.cats[t.category] = (bucket.cats[t.category] || 0) + amt;
    }
    return acc;
  }, [transactions]);

  const months = useMemo(() => Object.keys(byMonth).sort().reverse(), [byMonth]);
  const selected = month || months[0] || "";
  const isAll = month === "all";
  const prevMonth = isAll ? null : months[months.indexOf(selected) + 1] || null;

  /* Newest six months, oldest first, for the trend bars. */
  const trendMonths = useMemo(() => months.slice(0, 6).reverse(), [months]);

  const rows = useMemo(() => {
    const current = {};
    if (isAll) {
      for (const k of months) {
        for (const [c, v] of Object.entries(byMonth[k].cats)) current[c] = (current[c] || 0) + v;
      }
    } else if (byMonth[selected]) {
      Object.assign(current, byMonth[selected].cats);
    }
    const previous = prevMonth ? byMonth[prevMonth].cats : {};

    /* Union of the category list and anything actually seen in the data. */
    const names = new Set(categories.filter((c) => !isTransfer(c) && c !== "Income"));
    Object.keys(current).forEach((c) => names.add(c));

    const total = Object.values(current).reduce((a, b) => a + b, 0);

    return {
      total,
      list: [...names]
        .map((name) => {
          const amount = current[name] || 0;
          const before = previous[name] || 0;
          return {
            name,
            amount,
            before,
            share: total ? (amount / total) * 100 : 0,
            change: before ? ((amount - before) / before) * 100 : amount ? null : 0,
            trend: trendMonths.map((k) => byMonth[k].cats[name] || 0),
            /* Divide by every month on record, so the column sums to the total row. */
            months: isAll ? months.length : 1,
          };
        })
        .sort((a, b) => b.amount - a.amount),
    };
  }, [byMonth, months, selected, prevMonth, isAll, categories, trendMonths, isTransfer]);

  const visible = showEmpty ? rows.list : rows.list.filter((r) => r.amount > 0);
  const hiddenCount = rows.list.length - visible.length;
  const range = isAll || !selected ? null : monthRange(selected);

  if (!months.length) {
    return (
      <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-4 py-10 text-center">
        <p className="text-sm text-slate-600">No dated spending yet.</p>
        <p className="text-xs text-slate-500 mt-1">Add a statement and this fills in month by month.</p>
      </div>
    );
  }

  return (
    <div className="bg-white rounded-xl shadow-sm border border-slate-200">
      <div className="px-4 pt-3.5 pb-2 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="text-sm font-semibold text-slate-800">Spending by category</h2>
          <p className="text-xs text-slate-500 mt-0.5">
            {isAll
              ? `Every month on record — ${months.length} in total.`
              : `${fullMonthName(selected)}${prevMonth ? `, compared with ${fullMonthName(prevMonth)}` : ""}.`}
          </p>
        </div>
        <div className="flex items-center gap-2">
          <label className="flex items-center gap-1.5 text-xs text-slate-600">
            <input
              type="checkbox"
              checked={showEmpty}
              onChange={(e) => setShowEmpty(e.target.checked)}
              className="accent-indigo-600"
            />
            Show unused
          </label>
          <select
            value={isAll ? "all" : selected}
            onChange={(e) => setMonth(e.target.value)}
            className="text-sm border border-slate-300 rounded-lg px-2 py-1.5 bg-white"
          >
            {months.map((m) => <option key={m} value={m}>{fullMonthName(m)}</option>)}
            <option value="all">All months</option>
          </select>
        </div>
      </div>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-slate-50 border-y border-slate-200 text-xs font-medium uppercase tracking-widest text-slate-500">
              <th className="text-left px-4 py-2">Category</th>
              <th className="text-left px-3 py-2 w-32">Share</th>
              <th className="text-left px-3 py-2 w-24">6-mo trend</th>
              <th className="text-right px-3 py-2 w-28">{isAll ? "Total" : "Spent"}</th>
              <th className="text-right px-4 py-2 w-28">{isAll ? "Avg / mo" : "vs prev"}</th>
            </tr>
          </thead>
          <tbody>
            {visible.map((r) => {
              const peak = Math.max(1, ...r.trend);
              return (
                <tr
                  key={r.name}
                  onClick={() => onJump({ category: r.name, from: range?.[0], to: range?.[1] })}
                  title="See these transactions"
                  className="border-b border-slate-100 hover:bg-indigo-50 cursor-pointer"
                >
                  <td className="px-4 py-2">
                    <span className={`px-2 py-0.5 rounded text-xs ${chipFor(r.name)}`}>{r.name}</span>
                  </td>
                  <td className="px-3 py-2">
                    <div className="flex items-center gap-2">
                      <div className="flex-1 h-1.5 bg-slate-100 rounded">
                        <div className="h-full bg-indigo-500 rounded" style={{ width: `${r.share}%` }} />
                      </div>
                      <span className="text-xs text-slate-400 tabular-nums w-8 text-right">
                        {r.share >= 1 ? `${r.share.toFixed(0)}%` : ""}
                      </span>
                    </div>
                  </td>
                  <td className="px-3 py-2">
                    <div className="flex items-end gap-0.5 h-5">
                      {r.trend.map((v, i) => (
                        <div key={i} className="flex-1 bg-slate-100 rounded-sm flex items-end h-full" title={fullMonthName(trendMonths[i])}>
                          <div
                            className="w-full bg-indigo-400 rounded-sm"
                            style={{ height: v ? `${Math.max(12, (v / peak) * 100)}%` : "2px" }}
                          />
                        </div>
                      ))}
                    </div>
                  </td>
                  <td className={`px-3 py-2 text-right tabular-nums ${r.amount ? "text-slate-800" : "text-slate-300"}`}>
                    {money(r.amount)}
                  </td>
                  <td className="px-4 py-2 text-right tabular-nums text-xs">
                    {isAll ? (
                      <span className="text-slate-500">{money(r.months ? r.amount / r.months : 0)}</span>
                    ) : r.change === null ? (
                      <span className="text-slate-400">new</span>
                    ) : r.change === 0 && !r.amount ? (
                      <span className="text-slate-300">—</span>
                    ) : (
                      <span className={r.change > 0 ? "text-rose-600" : r.change < 0 ? "text-emerald-600" : "text-slate-400"}>
                        {r.change > 0 ? "+" : ""}{r.change.toFixed(0)}%
                      </span>
                    )}
                  </td>
                </tr>
              );
            })}
            <tr className="bg-slate-50 font-semibold">
              <td className="px-4 py-2">Total</td>
              <td className="px-3 py-2" />
              <td className="px-3 py-2" />
              <td className="px-3 py-2 text-right tabular-nums">{money(rows.total)}</td>
              <td className="px-4 py-2 text-right tabular-nums text-xs text-slate-500">
                {isAll && months.length ? money(rows.total / months.length) : ""}
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      {hiddenCount > 0 && (
        <p className="px-4 py-2 text-xs text-slate-500 border-t border-slate-100">
          {hiddenCount} {hiddenCount === 1 ? "category has" : "categories have"} no spending
          {isAll ? "" : " this month"}. Tick "Show unused" to include them.
        </p>
      )}
    </div>
  );
}

const PERIODS = [
  ["all", "All time"],
  ["30", "30 days"],
  ["90", "90 days"],
  ["365", "12 months"],
];

const INK = "#5b5bd6";
const INK_SOFT = "#c5c7ee";
const GOOD = "#22c55e";
const BAD = "#ef4444";
const RING = ["#4f46e5", "#93c5fd", "#c4b5fd", "#5eead4", "#a5b4fc", "#818cf8", "#cbd5e1"];
const BADGE = ["bg-indigo-100 text-indigo-700", "bg-emerald-100 text-emerald-700", "bg-sky-100 text-sky-700", "bg-violet-100 text-violet-700", "bg-amber-100 text-amber-700", "bg-rose-100 text-rose-700"];

const compact = (n) => {
  const a = Math.abs(n);
  const sign = n < 0 ? "-" : "";
  if (a >= 1e6) return `${sign}$${(a / 1e6).toFixed(2)}M`;
  if (a >= 1e3) return `${sign}$${(a / 1e3).toFixed(1)}K`;
  return `${sign}$${Math.round(a)}`;
};

/* Build a gap-free month series with a running balance. */
function buildMonthly(txns, openingTotal, isTransfer = (c) => c === "Transfers") {
  const map = {};
  for (const t of txns) {
    if (isTransfer(t.category)) continue;
    const k = monthKey(t.date);
    if (!k) continue;
    if (!map[k]) map[k] = { income: 0, expense: 0 };
    if (t.amount > 0) map[k].income += t.amount;
    else map[k].expense += Math.abs(t.amount);
  }
  const keys = Object.keys(map).sort();
  if (!keys.length) return [];
  let [y, m] = keys[0].split("-").map(Number);
  const [ey, em] = keys[keys.length - 1].split("-").map(Number);
  const out = [];
  let bal = openingTotal;
  let guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard++ < 120) {
    const k = `${y}-${String(m).padStart(2, "0")}`;
    const e = map[k] || { income: 0, expense: 0 };
    const net = e.income - e.expense;
    bal += net;
    out.push({ key: k, label: monthLabel(k), income: e.income, expense: e.expense, net, balance: bal });
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return out.slice(-24);
}

/* ---- KPI sparkline ---- */
function KpiSpark({ data, mode }) {
  if (data.length < 2) return null;
  const maxChg = Math.max(1, ...data.map((d) => Math.abs(d.chg)));
  return (
    <ResponsiveContainer width="100%" height={56}>
      <ComposedChart data={data} margin={{ top: 4, right: 2, left: 2, bottom: 0 }}>
        <YAxis yAxisId="v" hide domain={["dataMin", "dataMax"]} />
        <YAxis yAxisId="c" hide domain={[0, maxChg * (mode === "grow" ? 1.05 : 4)]} />
        <Tooltip
          cursor={false}
          contentStyle={{ fontSize: 11, borderRadius: 6, border: "1px solid #e2e8f0", padding: "4px 8px" }}
          labelFormatter={(l) => l}
          formatter={(v, n) => (n === "v" ? [money(v), "Total"] : null)}
        />
        {mode === "grow" ? (
          <Bar yAxisId="c" dataKey="chg" radius={[2, 2, 0, 0]} maxBarSize={9}>
            {data.map((d, i) => <Cell key={i} fill={d.chg >= 0 ? GOOD : BAD} />)}
          </Bar>
        ) : (
          <Bar yAxisId="c" dataKey="chgAbs" radius={[1, 1, 0, 0]} maxBarSize={7}>
            {data.map((d, i) => <Cell key={i} fill={d.chg >= 0 ? GOOD : BAD} />)}
          </Bar>
        )}
        <Line yAxisId="v" type="monotone" dataKey="v" stroke={INK} strokeWidth={1.75} dot={false} />
      </ComposedChart>
    </ResponsiveContainer>
  );
}

function KpiCard({ label, value, delta, positiveIsGood = true, tint, icon, spark }) {
  const up = delta !== null && delta >= 0;
  const good = positiveIsGood ? up : !up;
  return (
    <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-4 py-3.5 flex items-center gap-4">
      <div className="min-w-0">
        <div className="flex items-center gap-2">
          <span className="text-sm font-semibold text-slate-700 whitespace-nowrap">{label}</span>
          <span className={`w-6 h-6 rounded-md grid place-items-center shrink-0 ${tint}`}>{icon}</span>
        </div>
        <p className="mt-1 text-3xl font-bold tracking-tight text-slate-900 tabular-nums">{value}</p>
        <p className={`mt-1 text-xs font-medium tabular-nums ${delta === null ? "text-slate-400" : good ? "text-emerald-600" : "text-rose-600"}`}>
          {delta === null ? "no prior month" : `${up ? "+" : ""}${delta.toFixed(1)}% ${up ? "▲" : "▼"} vs last month`}
        </p>
      </div>
      <div className="flex-1 min-w-0 hidden sm:block">{spark}</div>
    </div>
  );
}

function DashboardView({ sources, transactions, categories, isTransfer, openings, onOpening, onJump }) {
  const [period, setPeriod] = useState("all");

  const latest = useMemo(
    () => transactions.reduce((m, t) => (t.date && t.date > m ? t.date : m), ""),
    [transactions]
  );

  const scoped = useMemo(() => {
    if (period === "all" || !latest) return transactions;
    const d = new Date(latest + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - Number(period));
    const cutoff = toISO(d);
    return transactions.filter((t) => t.date && t.date >= cutoff);
  }, [transactions, period, latest]);

  const all = useMemo(() => summarize(scoped, isTransfer), [scoped, isTransfer]);

  const perAccount = useMemo(
    () => sources.map((s) => ({ source: s, stats: summarize(scoped.filter((t) => t.sourceId === s.id), isTransfer) })),
    [sources, scoped, isTransfer]
  );

  /* account summary rows, opening balance is user-supplied */
  const rows = useMemo(
    () =>
      perAccount.map(({ source, stats }) => {
        const opening = parseAmount(openings[source.name]) || 0;
        return {
          id: source.id,
          name: source.name,
          opening,
          income: stats.inflow,
          expense: stats.outflow,
          current: opening + stats.inflow - stats.outflow,
          review: stats.review,
        };
      }),
    [perAccount, openings]
  );

  const totals = useMemo(
    () =>
      rows.reduce(
        (a, r) => ({
          opening: a.opening + r.opening,
          income: a.income + r.income,
          expense: a.expense + r.expense,
          current: a.current + r.current,
        }),
        { opening: 0, income: 0, expense: 0, current: 0 }
      ),
    [rows]
  );

  const monthly = useMemo(() => buildMonthly(scoped, totals.opening, isTransfer), [scoped, totals.opening, isTransfer]);

  const pct = (a, b) => (b ? ((a - b) / Math.abs(b)) * 100 : null);
  const lastM = monthly[monthly.length - 1];
  const prevM = monthly[monthly.length - 2];

  const sparks = useMemo(() => {
    const mk = (get) =>
      monthly.map((d, i) => {
        const v = get(d);
        const chg = i === 0 ? 0 : v - get(monthly[i - 1]);
        return { label: d.label, v, chg, chgAbs: Math.abs(chg) };
      });
    return { balance: mk((d) => d.balance), expense: mk((d) => d.expense), income: mk((d) => d.income) };
  }, [monthly]);

  /* waterfall: monthly change in balance, running from zero, plus a total bar */
  const waterfall = useMemo(() => {
    let run = 0;
    const bars = monthly.map((d) => {
      const start = run;
      run += d.net;
      return {
        label: d.label,
        base: Math.min(start, run),
        delta: Math.abs(d.net),
        net: d.net,
        kind: d.net >= 0 ? "up" : "down",
      };
    });
    if (bars.length) bars.push({ label: "Total", base: Math.min(0, run), delta: Math.abs(run), net: run, kind: "total" });
    return bars;
  }, [monthly]);

  const avgBalance = monthly.length ? monthly.reduce((s, d) => s + d.balance, 0) / monthly.length : 0;

  const categorySlices = useMemo(() => {
    const top = all.cats.slice(0, 6);
    const rest = all.cats.slice(6).reduce((s, c) => s + c[1], 0);
    const list = top.map(([name, value], i) => ({ name, value, fill: RING[i % RING.length] }));
    if (rest > 0) list.push({ name: "Others", value: rest, fill: RING[6] });
    return list.sort((a, b) => b.value - a.value);
  }, [all.cats]);

  const flags = useMemo(() => {
    const out = [];
    for (const { source, stats } of perAccount) {
      if (!(source.files || []).length) {
        out.push({ label: source.name, text: "No statements added yet.", account: source.id });
        continue;
      }
      if (source.files.every((f) => f.mapping.date < 0))
        out.push({ label: source.name, text: "No date column mapped, so this account is missing from every trend.", account: source.id });
      else if (stats.count > 3 && stats.dated === 0)
        out.push({ label: source.name, text: "Dates aren't parsing. Check the date column in the account panel.", account: source.id });
      if (stats.count > 5 && stats.outflow === 0 && stats.inflow > 0)
        out.push({ label: source.name, text: 'Every amount is positive. Turn on "Flip the sign" for this account.', account: source.id });
      if (stats.count > 5 && stats.inflow === 0 && stats.outflow > 0)
        out.push({ label: source.name, text: "No deposits found. Check the sign or the debit/credit columns.", account: source.id });
    }
    if (all.review) out.push({ label: "Categories", text: `${all.review} transactions still need one.`, review: true });
    return out;
  }, [perAccount, all.review]);

  const axisFmt = (v) => compact(v);
  const tipStyle = { fontSize: 12, borderRadius: 6, border: "1px solid #e2e8f0" };

  if (!sources.length) {
    return (
      <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-5 py-20 text-center">
        <Wallet size={26} className="mx-auto text-slate-300" />
        <p className="mt-3 text-slate-700 font-medium">No accounts yet</p>
        <p className="mt-1 text-sm text-slate-500">Add a bank export and this fills in with balances, trends, and recurring charges.</p>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      <SpendByCategory transactions={transactions} categories={categories} isTransfer={isTransfer} onJump={onJump} />

      {/* toolbar */}
      <div className="flex flex-wrap items-center gap-3">
        <div className="flex rounded-lg border border-slate-300 overflow-hidden bg-white">
          {PERIODS.map(([k, label]) => (
            <button
              key={k}
              onClick={() => setPeriod(k)}
              className={`px-2.5 py-1.5 text-xs ${period === k ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-50"}`}
            >
              {label}
            </button>
          ))}
        </div>
        <p className="text-xs font-mono text-slate-500 flex items-center gap-1.5">
          <Calendar size={12} />
          {longDate(all.first)} → {longDate(all.last)}
        </p>
      </div>

      {flags.length > 0 && (
        <div className="bg-white rounded-xl shadow-sm border border-amber-300">
          <div className="px-4 pt-3 pb-1 flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-amber-700">
            <AlertTriangle size={13} /> Worth a look
          </div>
          <ul className="divide-y divide-slate-100">
            {flags.map((f, i) => (
              <li key={i}>
                <button onClick={() => onJump({ account: f.account, review: f.review, settings: !!f.account })} className="w-full text-left px-4 py-2 text-sm hover:bg-amber-50 flex gap-2">
                  <span className="font-medium text-slate-900 shrink-0">{f.label}</span>
                  <span className="text-slate-600">{f.text}</span>
                </button>
              </li>
            ))}
          </ul>
        </div>
      )}

      {/* KPI row */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <KpiCard
          label="Total Balance"
          value={compact(totals.current)}
          delta={lastM && prevM ? pct(lastM.balance, prevM.balance) : null}
          tint="bg-indigo-100 text-indigo-600"
          icon={<Wallet size={13} />}
          spark={<KpiSpark data={sparks.balance} mode="grow" />}
        />
        <KpiCard
          label="Total Expense"
          value={compact(totals.expense)}
          delta={lastM && prevM ? pct(lastM.expense, prevM.expense) : null}
          positiveIsGood={false}
          tint="bg-rose-100 text-rose-600"
          icon={<ArrowDownRight size={13} />}
          spark={<KpiSpark data={sparks.expense} mode="flow" />}
        />
        <KpiCard
          label="Total Income"
          value={compact(totals.income)}
          delta={lastM && prevM ? pct(lastM.income, prevM.income) : null}
          tint="bg-emerald-100 text-emerald-600"
          icon={<ArrowUpRight size={13} />}
          spark={<KpiSpark data={sparks.income} mode="flow" />}
        />
      </div>

      {/* chart grid */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
        {/* income vs expense */}
        <Card title="Income vs Expense" className="lg:col-span-5" bodyClass="px-2 pb-3 pt-2">
          <ResponsiveContainer width="100%" height={196}>
            <AreaChart data={monthly} margin={{ top: 8, right: 10, left: 0, bottom: 0 }}>
              <defs>
                <linearGradient id="gIncome" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={INK} stopOpacity={0.22} />
                  <stop offset="100%" stopColor={INK} stopOpacity={0.02} />
                </linearGradient>
              </defs>
              <CartesianGrid stroke="#e2e8f0" strokeDasharray="3 3" vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 10, fill: "#94a3b8" }} tickLine={false} axisLine={false} interval="preserveStartEnd" />
              <YAxis tick={{ fontSize: 10, fill: "#94a3b8" }} tickLine={false} axisLine={false} width={46} tickFormatter={axisFmt} />
              <Tooltip contentStyle={tipStyle} formatter={(v, n) => [money(v), n]} />
              <Area type="monotone" dataKey="expense" name="Expense" stroke={INK_SOFT} strokeWidth={2} fill="none" dot={false} />
              <Area type="monotone" dataKey="income" name="Income" stroke={INK} strokeWidth={2} fill="url(#gIncome)" dot={false} />
            </AreaChart>
          </ResponsiveContainer>
          <div className="flex justify-center gap-4 text-xs text-slate-500">
            <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 inline-block" style={{ background: INK }} /> Income</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-0.5 inline-block" style={{ background: INK_SOFT }} /> Expense</span>
          </div>
        </Card>

        {/* balance trend */}
        <Card title="Account Balance Trend" className="lg:col-span-4" bodyClass="px-2 pb-3 pt-2">
          <ResponsiveContainer width="100%" height={214}>
            <BarChart data={monthly} margin={{ top: 8, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid stroke="#f1f5f9" vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 10, fill: "#94a3b8" }} tickLine={false} axisLine={false} interval="preserveStartEnd" />
              <YAxis tick={{ fontSize: 10, fill: "#94a3b8" }} tickLine={false} axisLine={false} width={46} tickFormatter={axisFmt} />
              <Tooltip contentStyle={tipStyle} formatter={(v) => [money(v), "Balance"]} />
              <ReferenceLine
                y={avgBalance}
                stroke="#94a3b8"
                strokeDasharray="4 4"
                label={{ value: `Average: ${compact(avgBalance)}`, position: "insideTopRight", fontSize: 10, fill: "#64748b" }}
              />
              <Bar dataKey="balance" fill={INK} radius={[3, 3, 0, 0]} maxBarSize={22} />
            </BarChart>
          </ResponsiveContainer>
        </Card>

        {/* expense by category — tall card on the right */}
        <Card title="Expense by Category" className="lg:col-span-3 lg:row-span-2" bodyClass="p-3">
          {categorySlices.length ? (
            <div className="flex flex-col h-full">
              <ul className="space-y-1 mb-1">
                {categorySlices.map((c) => (
                  <li key={c.name}>
                    <button onClick={() => onJump({ category: c.name === "Others" ? undefined : c.name })} className="w-full flex items-center gap-2 text-xs hover:bg-slate-50 rounded px-1 py-0.5">
                      <span className="w-2 h-2 rounded-full shrink-0" style={{ background: c.fill }} />
                      <span className="font-mono tabular-nums text-slate-700">{compact(c.value)}</span>
                      <span className="text-slate-400">|</span>
                      <span className="text-slate-600 truncate">{c.name}</span>
                    </button>
                  </li>
                ))}
              </ul>
              <ResponsiveContainer width="100%" height={300}>
                <RadialBarChart
                  data={categorySlices}
                  innerRadius="28%"
                  outerRadius="100%"
                  startAngle={90}
                  endAngle={-270}
                  barSize={13}
                >
                  <PolarAngleAxis type="number" domain={[0, categorySlices[0].value]} tick={false} />
                  <RadialBar background={{ fill: "#f1f5f9" }} dataKey="value" cornerRadius={7} />
                  <Tooltip contentStyle={tipStyle} formatter={(v, n, p) => [money(v), p?.payload?.name]} />
                </RadialBarChart>
              </ResponsiveContainer>
            </div>
          ) : (
            <p className="text-xs text-slate-500 py-8 text-center">No spending in this period.</p>
          )}
        </Card>

        {/* waterfall */}
        <Card title="Changes in Account Balance" className="lg:col-span-5" bodyClass="px-2 pb-3 pt-2">
          <ResponsiveContainer width="100%" height={196}>
            <BarChart data={waterfall} margin={{ top: 16, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid stroke="#f1f5f9" vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 10, fill: "#94a3b8" }} tickLine={false} axisLine={false} interval={0} />
              <YAxis tick={{ fontSize: 10, fill: "#94a3b8" }} tickLine={false} axisLine={false} width={46} tickFormatter={axisFmt} />
              <Tooltip contentStyle={tipStyle} formatter={(v, n, p) => [money(p?.payload?.net ?? v), "Change"]} />
              <Bar dataKey="base" stackId="w" fill="transparent" />
              <Bar dataKey="delta" stackId="w" radius={[2, 2, 0, 0]} maxBarSize={26}>
                {waterfall.map((d, i) => (
                  <Cell key={i} fill={d.kind === "total" ? INK : d.kind === "up" ? GOOD : BAD} />
                ))}
                <LabelList dataKey="net" position="top" fontSize={9} fill="#64748b" formatter={(v) => compact(v)} />
              </Bar>
            </BarChart>
          </ResponsiveContainer>
          <div className="flex justify-center gap-4 text-xs text-slate-500">
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm inline-block" style={{ background: GOOD }} /> Increase</span>
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm inline-block" style={{ background: BAD }} /> Decrease</span>
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm inline-block" style={{ background: INK }} /> Total</span>
          </div>
        </Card>

        {/* account summary */}
        <Card title="Account Summary" className="lg:col-span-4" bodyClass="pb-2">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-slate-500 border-b border-slate-200">
                  <th className="text-left font-medium px-4 py-1.5">Account</th>
                  <th className="text-right font-medium px-2 py-1.5">Opening</th>
                  <th className="text-right font-medium px-2 py-1.5">Income</th>
                  <th className="text-right font-medium px-2 py-1.5">Expense</th>
                  <th className="text-right font-medium px-4 py-1.5">Current</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={r.id} className="border-b border-slate-100 hover:bg-slate-50">
                    <td className="px-4 py-2">
                      <button onClick={() => onJump({ account: r.id })} className="flex items-center gap-2 min-w-0 group">
                        <span className={`w-6 h-6 rounded-md grid place-items-center text-xs font-bold shrink-0 ${BADGE[i % BADGE.length]}`}>
                          {r.name.trim().charAt(0).toUpperCase() || "?"}
                        </span>
                        <span className="truncate group-hover:text-indigo-700">{r.name}</span>
                      </button>
                    </td>
                    <td className="px-2 py-2 text-right">
                      <input
                        value={openings[r.name] ?? ""}
                        onChange={(e) => onOpening(r.name, e.target.value)}
                        placeholder="$0"
                        title="Type this account's starting balance"
                        className="w-20 text-right tabular-nums bg-transparent border-b border-dashed border-slate-300 hover:border-indigo-400 focus:border-indigo-600 focus:outline-none px-1"
                      />
                    </td>
                    <td className="px-2 py-2 text-right tabular-nums text-emerald-700">{compact(r.income)}</td>
                    <td className="px-2 py-2 text-right tabular-nums text-rose-600">{compact(r.expense)}</td>
                    <td className="px-4 py-2 text-right tabular-nums font-medium">{compact(r.current)}</td>
                  </tr>
                ))}
                <tr className="font-semibold bg-slate-50">
                  <td className="px-4 py-2">Total</td>
                  <td className="px-2 py-2 text-right tabular-nums">{compact(totals.opening)}</td>
                  <td className="px-2 py-2 text-right tabular-nums">{compact(totals.income)}</td>
                  <td className="px-2 py-2 text-right tabular-nums">{compact(totals.expense)}</td>
                  <td className="px-4 py-2 text-right tabular-nums">{compact(totals.current)}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <p className="px-4 pt-2 text-xs text-slate-500">
            Opening balances are yours to fill in — bank exports don't carry them. Everything else is calculated.
          </p>
        </Card>
      </div>

      {/* merchants + recurring */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <Card title="Top merchants" className="lg:col-span-5" bodyClass="pb-2">
          <ul className="divide-y divide-slate-100">
            {all.merchants.slice(0, 8).map(([name, m]) => (
              <li key={name}>
                <button onClick={() => onJump({ search: name })} className="w-full flex items-baseline justify-between gap-2 px-4 py-2 text-sm hover:bg-slate-50 text-left">
                  <span className="truncate">{name}</span>
                  <span className="shrink-0 tabular-nums text-slate-700">
                    {money(m.total)} <span className="text-slate-400 text-xs">×{m.count}</span>
                  </span>
                </button>
              </li>
            ))}
            {!all.merchants.length && <li className="px-4 py-2 text-xs text-slate-500">Nothing yet.</li>}
          </ul>
        </Card>

        <Card
          title="Looks recurring"
          className="lg:col-span-7"
          bodyClass="pb-2"
          action={
            all.recurring.length ? (
              <span className="text-xs text-slate-500 tabular-nums">
                ≈{money(all.recurring.reduce((s, r) => s + r.monthly, 0))}/mo
              </span>
            ) : null
          }
        >
          {all.recurring.length ? (
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs text-slate-500 border-b border-slate-200">
                  <th className="text-left font-medium px-4 py-1.5">Merchant</th>
                  <th className="text-right font-medium px-2 py-1.5">Per month</th>
                  <th className="text-right font-medium px-2 py-1.5">Charges</th>
                  <th className="text-right font-medium px-4 py-1.5">Last seen</th>
                </tr>
              </thead>
              <tbody>
                {all.recurring.slice(0, 8).map((r) => (
                  <tr key={r.name} className="border-b border-slate-100 hover:bg-slate-50 cursor-pointer" onClick={() => onJump({ search: r.name })}>
                    <td className="px-4 py-2 truncate">{r.name}</td>
                    <td className="px-2 py-2 text-right tabular-nums">{money(r.monthly)}</td>
                    <td className="px-2 py-2 text-right tabular-nums text-slate-500">{r.count}</td>
                    <td className="px-4 py-2 text-right text-xs text-slate-500">{shortDate(r.last)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          ) : (
            <p className="px-4 py-4 text-xs text-slate-500">
              Nothing repeats often enough yet. This needs at least three months of history to find patterns.
            </p>
          )}
        </Card>
      </div>
    </div>
  );
}

  const [expanded, setExpanded] = useState(null);
  const [expandedFile, setExpandedFile] = useState(null);
  const [notice, setNotice] = useState("");
  const fileRef = useRef(null);
  const uploadTargetRef = useRef(null);
  const configRef = useRef(null);

  /* ---- persistence ---- */
  useEffect(() => {
    (async () => {
      let accounts = null;
      try {
        const res = await window.storage?.get(STORE_KEY);
        if (res?.value) {
          const c = JSON.parse(res.value);
          if (c.rules) setRules(c.rules);
          if (c.overrides) setOverrides(c.overrides);
          if (c.categories) setCategories(c.categories);
          if (c.opts) setOpts((o) => ({ ...o, ...c.opts }));
          if (c.openings) setOpenings(c.openings);
          if (c.accounts) accounts = c.accounts.map((a) => ({ ...a, files: [] }));
          if (c.deleted) setDeleted(c.deleted);
          if (c.directions) setDirections(c.directions);
      if (c.excluded) setExcluded(c.excluded);
      if (c.names) setNames(c.names);
          if (c.catMap) setCatMap(c.catMap);
          if (c.excluded) setExcluded(c.excluded);
          if (c.names) setNames(c.names);
        }
      } catch { /* first run, nothing saved yet */ }

      /* Put the statements back where they were. */
      try {
        const raw = window.localCache?.get(STATEMENT_KEY);
        if (raw && accounts) {
          const byAccount = JSON.parse(raw);
          accounts = accounts.map((a) => ({ ...a, files: byAccount[a.id] || [] }));
        }
      } catch { /* cache unreadable; accounts just start empty */ }

      if (accounts) setSources(accounts);
      setLoaded(true);
    })();
  }, []);

  /* Keep the cache in step with what's loaded. If the browser runs out of room,
     drop the oldest statements rather than losing everything. */
  useEffect(() => {
    if (!loaded || !window.localCache) return;
    const timer = setTimeout(() => {
      const byAccount = {};
      for (const a of sources) if (a.files?.length) byAccount[a.id] = a.files;
      if (!Object.keys(byAccount).length) {
        window.localCache.remove(STATEMENT_KEY);
        return;
      }
      try {
        window.localCache.set(STATEMENT_KEY, JSON.stringify(byAccount));
      } catch {
        const queue = [];
        for (const id of Object.keys(byAccount)) byAccount[id].forEach((f) => queue.push([id, f.fid]));
        let dropped = 0;
        let saved = false;
        while (queue.length > 1 && !saved) {
          const [id, fid] = queue.shift();
          byAccount[id] = byAccount[id].filter((f) => f.fid !== fid);
          if (!byAccount[id].length) delete byAccount[id];
          dropped++;
          try { window.localCache.set(STATEMENT_KEY, JSON.stringify(byAccount)); saved = true; } catch { /* keep trimming */ }
        }
        setNotice(
          saved
            ? `Not enough browser storage to remember every statement, so the ${dropped} oldest ${dropped === 1 ? "was" : "were"} left out. Everything still shows until you reload.`
            : "Not enough browser storage to remember these statements after a reload."
        );
      }
    }, 800);
    return () => clearTimeout(timer);
  }, [sources, loaded]);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => {
      try {
        window.storage?.set(STORE_KEY, JSON.stringify({
          rules, overrides, categories, opts, openings, deleted, directions, catMap, excluded, names,
          accounts: sources.map(({ id, name, flip, savedHeaders, savedMapping }) => ({ id, name, flip, savedHeaders, savedMapping })),
        }))?.catch?.(() => {});
      } catch { /* storage unavailable; session-only */ }
    }, 500);
    return () => clearTimeout(t);
  }, [rules, overrides, categories, opts, openings, deleted, directions, catMap, excluded, names, sources, loaded]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 7000);
    return () => clearTimeout(t);
  }, [toast]);

  /* ---- file intake ---- */
  /* Read one workbook into a statement record. Throws if there's nothing usable. */
  const parseStatement = async (file) => {
    if (/\.pdf$/i.test(file.name)) {
      const lines = await pdfToLines(await file.arrayBuffer());
      const rows = linesToRows(lines);
      if (!rows.length) throw new Error("no transactions found");
      const headers = rows[0].map(String);
      return {
        fid: `f-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
        fileName: file.name,
        sheet: "extracted from PDF",
        kind: "pdf",
        rows,
        headers,
        headerRow: 0,
        mapping: { date: 0, desc: 1, amount: 2, debit: -1, credit: -1 },
      };
    }
    let wb;
    if (/\.(csv|tsv|txt)$/i.test(file.name)) {
      wb = XLSX.read(await file.text(), { type: "string", cellDates: true });
    } else {
      wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    }
    let best = null;
    for (const nm of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, blankrows: false });
      if (!best || rows.length > best.rows.length) best = { name: nm, rows };
    }
    if (!best || best.rows.length < 2) throw new Error("no rows");
    const headerRow = detectHeaderRow(best.rows);
    const headers = (best.rows[headerRow] || []).map((h) => String(h ?? ""));
    return {
      fid: `f-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
      fileName: file.name,
      sheet: best.name,
      rows: best.rows,
      headers,
      headerRow,
      mapping: autoMap(headers),
    };
  };

  const createAccount = (name) => {
    const id = `acct-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    setSources((l) => [
      ...l,
      { id, name: name || `Account ${l.length + 1}`, flip: false, files: [], savedHeaders: null, savedMapping: null },
    ]);
    return id;
  };

  /* Filing a statement never touches the account's name. If the layout matches
     something this account has seen before, reuse that mapping. */
  const attachStatements = (accountId, parsed) =>
    setSources((list) =>
      list.map((a) => {
        if (a.id !== accountId) return a;
        const files = [...(a.files || [])];
        let savedH = a.savedHeaders;
        let savedM = a.savedMapping;
        for (const f of parsed) {
          const known =
            (sameHeaders(savedH, f.headers) && savedM) ||
            files.find((x) => sameHeaders(x.headers, f.headers))?.mapping;
          const filed = known ? { ...f, mapping: { ...known } } : f;
          files.push(filed);
          if (!savedH) { savedH = filed.headers; savedM = filed.mapping; }
        }
        return { ...a, files, savedHeaders: savedH, savedMapping: savedM };
      })
    );

  /* Once a statement is trusted, either file it or ask where it goes. */
  const fileStatements = (parsed, targetId) => {
    if (targetId) return attachStatements(targetId, parsed);
    if (!sources.length) {
      const id = createAccount(parsed[0].fileName.replace(/\.[^.]+$/, ""));
      return attachStatements(id, parsed);
    }
    setPendingFiles(parsed);
  };

  const handleFiles = async (fileList, targetId) => {
    const files = Array.from(fileList || []);
    const parsed = [];
    for (const file of files) {
      const isPdf = /\.pdf$/i.test(file.name);
      try {
        parsed.push(await parseStatement(file));
      } catch (err) {
        if (!isPdf) {
          setNotice(`Couldn't read ${file.name}. Save it as .xlsx or .csv and try again.`);
        } else if (String(err.message).includes("unavailable")) {
          setNotice("The PDF reader couldn't load. Check your connection, or download this statement as CSV instead.");
        } else {
          setNotice(`No transactions found in ${file.name}. It may be a scanned image rather than a text PDF — a CSV export will work better.`);
        }
      }
    }
    if (!parsed.length) return;
    setNotice("");
    /* PDF parsing is a guess, so show what came out before it counts. */
    if (parsed.some((f) => f.kind === "pdf")) return setPreview({ parsed, targetId });
    fileStatements(parsed, targetId);
  };

  const pickFilesFor = (accountId) => {
    uploadTargetRef.current = accountId || null;
    fileRef.current?.click();
  };

  const removeStatement = (aid, fid) =>
    setSources((l) => l.map((a) => (a.id === aid ? { ...a, files: a.files.filter((f) => f.fid !== fid) } : a)));

  /* A mapping fix applies to every statement in the account sharing that layout,
     and is remembered for the next upload. */
  const updateFileMapping = (aid, fid, field, val) =>
    setSources((l) =>
      l.map((a) => {
        if (a.id !== aid) return a;
        const target = a.files.find((f) => f.fid === fid);
        if (!target) return a;
        const mapping = { ...target.mapping, [field]: val };
        return {
          ...a,
          files: a.files.map((f) => (sameHeaders(f.headers, target.headers) ? { ...f, mapping } : f)),
          savedHeaders: target.headers,
          savedMapping: mapping,
        };
      })
    );

  const updateSource = (id, patch) =>
    setSources((s) => s.map((x) => (x.id === id ? { ...x, ...patch } : x)));

  /* ---- derived transactions ---- */
  /* Transfers never count, plus anything the user has marked as moving money
     rather than spending it (a credit card payment, say). */
  const isTransfer = useMemo(() => {
    const set = new Set(["Transfers", ...excluded]);
    return (c) => set.has(c);
  }, [excluded]);

  const transactions = useMemo(() => {
    let all = sources.flatMap(accountTransactions);
    if (opts.dedupe) {
      const seen = new Set();
      all = all.filter((t) => {
        const k = `${t.sourceId}|${t.date}|${t.amount}|${t.rawDesc}`;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }
    return all
      .map((t) => {
        const d = directions[entryKey(t)];
        if (!d) return t;
        return { ...t, amount: d === "out" ? -Math.abs(t.rawAmount) : Math.abs(t.rawAmount), flow: d };
      })
      .map((t) => enrich(t, rules, opts, overrides, catMap))
      .map((t) => {
        const custom = names[entryKey(t)];
        return custom ? { ...t, cleanDesc: custom, nameEdited: true } : t;
      })
      .map((t) => (deleted[entryKey(t)] ? { ...t, deleted: true } : t))
      .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }, [sources, rules, opts, overrides, deleted, directions, catMap, names]);

  /* Deleted entries stay out of every total, chart, and export. */
  const live = useMemo(() => transactions.filter((t) => !t.deleted), [transactions]);
  const deletedCount = useMemo(() => transactions.filter((t) => t.deleted).length, [transactions]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    const pool = showDeleted ? transactions.filter((t) => t.deleted) : live;
    return pool.filter((t) => {
      if (filterSource !== "all" && t.sourceId !== filterSource) return false;
      if (filterCat !== "all" && t.category !== filterCat) return false;
      if (filterRule !== "all" && t.ruleId !== filterRule) return false;
      if (dateFrom && (!t.date || t.date < dateFrom)) return false;
      if (dateTo && (!t.date || t.date > dateTo)) return false;
      if (flowFilter === "out" && t.amount >= 0) return false;
      if (flowFilter === "in" && t.amount < 0) return false;
      if (onlyReview && t.category !== "Uncategorized") return false;
      if (q && !(t.cleanDesc.toLowerCase().includes(q) || t.rawDesc.toLowerCase().includes(q))) return false;
      return true;
    });
  }, [transactions, live, showDeleted, search, filterSource, filterCat, onlyReview, filterRule, dateFrom, dateTo, flowFilter]);

  /* Sorting is applied after filtering so the two stay independent. */
  const visible = useMemo(() => {
    const dir = sort.dir === "asc" ? 1 : -1;
    const rows = [...filtered];
    rows.sort((a, b) => {
      if (sort.key === "merchant") return dir * a.cleanDesc.localeCompare(b.cleanDesc);
      if (sort.key === "category") return dir * (a.category || "").localeCompare(b.category || "");
      if (sort.key === "amount") return dir * (a.amount - b.amount);
      return dir * (a.date || "").localeCompare(b.date || "");
    });
    return rows;
  }, [filtered, sort]);

  const stats = useMemo(() => {
    let inflow = 0, outflow = 0;
    const byCat = {};
    for (const t of visible) {
      if (isTransfer(t.category)) continue;
      if (t.amount > 0) inflow += t.amount; else outflow += Math.abs(t.amount);
      if (t.amount < 0) byCat[t.category] = (byCat[t.category] || 0) + Math.abs(t.amount);
    }
    const review = transactions.filter((t) => t.category === "Uncategorized").length;
    return {
      inflow, outflow, review,
      byCat: Object.entries(byCat).sort((a, b) => b[1] - a[1]),
    };
  }, [visible, transactions, isTransfer]);

  /* ---- actions ---- */
  const jumpToLedger = ({ account, category, review, search: q, settings, rule, from, to } = {}) => {
    if (settings) {
      setExpanded(account || null);
      setView("settings");
      return;
    }
    setFilterSource(account || "all");
    setFilterCat(category || "all");
    setFilterRule(rule || "all");
    setOnlyReview(!!review);
    setSearch(q || "");
    setDateFrom(from || ""); setDateTo(to || "");
    setFlowFilter("all");
    setShowDeleted(false);
    setLimit(150);
    setView("ledger");
  };

  /* Renames this one transaction only. Deliberately not a rule. */
  const renameEntry = (t, value) => {
    const v = (value || "").trim();
    setNames((m) => {
      const n = { ...m };
      if (v) n[entryKey(t)] = v;
      else delete n[entryKey(t)];
      return n;
    });
  };

  const clearName = (t) =>
    setNames((m) => { const n = { ...m }; delete n[entryKey(t)]; return n; });

  const deleteEntry = (t) => {
    const k = entryKey(t);
    setDeleted((d) => ({ ...d, [k]: 1 }));
    setToast({
      text: `Removed ${t.cleanDesc}`,
      undo: () => setDeleted((d) => { const n = { ...d }; delete n[k]; return n; }),
    });
  };

  /* Force a single entry to count as money in or money out. */
  const setFlow = (t, dir) =>
    setDirections((d) => {
      const n = { ...d };
      if (dir) n[entryKey(t)] = dir;
      else delete n[entryKey(t)];
      return n;
    });

  const flipFlow = (t) => setFlow(t, t.amount < 0 ? "in" : "out");

  const restoreEntry = (t) =>
    setDeleted((d) => { const n = { ...d }; delete n[entryKey(t)]; return n; });

  const setCategory = (txn, cat) =>
    setOverrides((o) => ({ ...o, [overrideKey(txn)]: cat }));

  const clearOverride = (txn) =>
    setOverrides((o) => { const n = { ...o }; delete n[overrideKey(txn)]; return n; });

  /* ---- categories ---- */
  const ruleCounts = useMemo(() => {
    const m = {};
    for (const t of live) if (t.ruleId) m[t.ruleId] = (m[t.ruleId] || 0) + 1;
    return m;
  }, [live]);

  /* Months that actually have transactions, newest first. */
  const monthOptions = useMemo(() => {
    const set = new Set();
    for (const t of live) if (t.date) set.add(t.date.slice(0, 7));
    return [...set].sort().reverse();
  }, [live]);

  const monthName = (key) => {
    const [y, m] = key.split("-");
    return new Date(Date.UTC(+y, +m - 1, 1)).toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
  };

  const pickMonth = (key) => {
    if (!key) { setDateFrom(""); setDateTo(""); return; }
    const [y, m] = key.split("-").map(Number);
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    setDateFrom(`${key}-01`);
    setDateTo(`${key}-${String(last).padStart(2, "0")}`);
  };

  /* Which month the current range corresponds to, if any. */
  const activeMonth = useMemo(() => {
    if (!dateFrom || !dateTo) return "";
    const key = dateFrom.slice(0, 7);
    const [y, m] = key.split("-").map(Number);
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return dateFrom === `${key}-01` && dateTo === `${key}-${String(last).padStart(2, "0")}` ? key : "";
  }, [dateFrom, dateTo]);

  const filtersActive =
    filterSource !== "all" || filterCat !== "all" || filterRule !== "all" ||
    onlyReview || !!search || !!dateFrom || !!dateTo || flowFilter !== "all";

  const sortMark = (key) =>
    sort.key !== key ? null : sort.dir === "asc" ? <ChevronUp size={12} /> : <ChevronDown size={12} />;

  const clearFilters = () => {
    setFilterSource("all"); setFilterCat("all"); setFilterRule("all");
    setOnlyReview(false); setSearch(""); setDateFrom(""); setDateTo(""); setFlowFilter("all");
  };

  const catCounts = useMemo(() => {
    const m = {};
    for (const t of live) m[t.category] = (m[t.category] || 0) + 1;
    return m;
  }, [live]);

  const addCategory = (raw) => {
    const name = raw.trim();
    if (!name || categories.includes(name)) return;
    setCategories((l) => {
      const i = l.indexOf("Uncategorized");
      return i === -1 ? [...l, name] : [...l.slice(0, i), name, ...l.slice(i)];
    });
    setNewCat("");
  };

  /* Renaming onto an existing name merges the two. */
  const renameCategory = (orig, raw) => {
    const name = raw.trim();
    setEditingCat(null);
    if (!name || name === orig || SYSTEM_CATEGORIES.has(orig)) return;
    setCategories((l) => {
      const next = l.map((c) => (c === orig ? name : c));
      return next.filter((c, i) => next.indexOf(c) === i);
    });
    setCatMap((m) => {
      const n = {};
      for (const [k, v] of Object.entries(m)) n[k] = v === orig ? name : v;
      n[orig] = name;
      return n;
    });
    setRules((rs) => rs.map((r) => (r.category === orig ? { ...r, category: name } : r)));
    setExcluded((l) => l.map((c) => (c === orig ? name : c)).filter((c, i, a) => a.indexOf(c) === i));
    setOverrides((o) => {
      const n = {};
      for (const [k, v] of Object.entries(o)) n[k] = v === orig ? name : v;
      return n;
    });
  };

  const deleteCategory = (cat) => {
    if (SYSTEM_CATEGORIES.has(cat)) return;
    const affected = catCounts[cat] || 0;
    setCategories((l) => l.filter((c) => c !== cat));
    setCatMap((m) => {
      const n = {};
      for (const [k, v] of Object.entries(m)) n[k] = v === cat ? "Uncategorized" : v;
      n[cat] = "Uncategorized";
      return n;
    });
    setRules((rs) => rs.map((r) => (r.category === cat ? { ...r, category: "" } : r)));
    setExcluded((l) => l.filter((c) => c !== cat));
    setOverrides((o) => {
      const n = {};
      for (const [k, v] of Object.entries(o)) if (v !== cat) n[k] = v;
      return n;
    });
    if (filterCat === cat) setFilterCat("all");
    setToast({ text: affected ? `Deleted ${cat}. ${affected} transactions moved to Uncategorized.` : `Deleted ${cat}.` });
  };

  const resetCategories = () => {
    setCategories(DEFAULT_CATEGORIES);
    setCatMap({});
    setToast({ text: "Categories reset to the built-in list." });
  };

  const addRule = (rule) => setRules((r) => [{ id: `r-${Date.now()}`, enabled: true, ...rule }, ...r]);
  const removeRule = (id) => setRules((r) => r.filter((x) => x.id !== id));
  const moveRule = (id, dir) =>
    setRules((r) => {
      const i = r.findIndex((x) => x.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= r.length) return r;
      const c = [...r];
      [c[i], c[j]] = [c[j], c[i]];
      return c;
    });

  /* Statements are too large to carry, but they're re-addable. Everything you
     built by hand travels in this file. */
  const exportSettings = () => {
    const payload = {
      app: "ledger-cleaner",
      version: 1,
      savedAt: new Date().toISOString(),
      rules, categories, catMap, overrides, deleted, directions, openings, opts, excluded, names,
      accounts: sources.map(({ id, name, flip, savedHeaders, savedMapping }) => ({ id, name, flip, savedHeaders, savedMapping })),
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `ledger-cleaner-settings-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setToast({ text: "Settings downloaded." });
  };

  const importSettings = async (file) => {
    try {
      const c = JSON.parse(await file.text());
      if (c.app !== "ledger-cleaner") throw new Error("wrong file");
      if (c.rules) setRules(c.rules);
      if (c.categories) setCategories(c.categories);
      if (c.catMap) setCatMap(c.catMap);
      if (c.overrides) setOverrides(c.overrides);
      if (c.deleted) setDeleted(c.deleted);
      if (c.directions) setDirections(c.directions);
      if (c.openings) setOpenings(c.openings);
      if (c.opts) setOpts((o) => ({ ...o, ...c.opts }));
      /* Keep any statements already loaded under accounts that carry over. */
      if (c.accounts) {
        setSources((cur) => c.accounts.map((a) => ({ ...a, files: cur.find((x) => x.id === a.id)?.files || [] })));
      }
      setNotice("");
      setToast({ text: `Loaded settings from ${file.name}.` });
    } catch {
      setNotice("That doesn't look like a Ledger Cleaner settings file.");
    }
  };

  const exportFile = (kind) => {
    const data = visible.map((t) => ({
      Date: t.date,
      Account: sources.find((s) => s.id === t.sourceId)?.name || "",
      Merchant: t.cleanDesc,
      Category: t.category,
      Amount: t.amount,
      "Original description": t.rawDesc,
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Transactions");
    XLSX.writeFile(wb, kind === "csv" ? "transactions-cleaned.csv" : "transactions-cleaned.xlsx");
  };

  /* ==========================================================================
   * RENDER
   * ========================================================================*/
  return (
    <div className="min-h-screen bg-slate-100 text-slate-900">
      {/* ---- top bar ---- */}
      <header className="bg-white border-b border-slate-200">
        <div className="max-w-7xl mx-auto px-5 py-4 flex flex-wrap items-center gap-4">
          <div className="mr-auto">
            <h1 className="text-lg font-semibold tracking-tight text-slate-900">Ledger Cleaner</h1>
            <p className="text-xs text-slate-500 font-mono mt-0.5">
              raw bank export → readable merchant → category
            </p>
          </div>
          <nav className="flex rounded-lg border border-slate-300 overflow-hidden">
            {[["dashboard", "Dashboard"], ["ledger", "Ledger"], ["rules", "Rules"], ["settings", "Settings"]].map(([k, label]) => (
              <button
                key={k}
                onClick={() => setView(k)}
                className={`px-3 py-1.5 text-xs font-mono uppercase tracking-widest ${
                  view === k ? "bg-indigo-600 text-white" : "text-slate-600 hover:bg-slate-50"
                }`}
              >
                {label}
              </button>
            ))}
          </nav>
          <button
            onClick={() => pickFilesFor(null)}
            className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300"
          >
            <Upload size={15} /> Add a file
          </button>
          <button

                            <button className={ITEM} onClick={() => { setFlowFilter("in"); setHeaderMenu(null); }}>Money in</button>
                          </div>

                      <th className="w-16" />

                              onKeyDown={(e) => {
                                if (e.key === "Enter") { renameEntry(t, editingName.value); setEditingName(null); }
                                if (e.key === "Escape") setEditingName(null);

                              className="w-full font-medium text-slate-900 bg-white border-b border-indigo-500 focus:outline-none"

                                  edited · reset

                              )}
                            </div>

                                <Trash2 size={14} />
                              </button>
                            </div>

                        </td>
                      </tr>
